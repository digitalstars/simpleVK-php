name: Сборка и публикация релиза

# Триггер: только при создании нового релиза
on:
  release:
    types: [created]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Получение исходного кода
        uses: actions/checkout@v4

      - name: 2. Настройка PHP и Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, json
          tools: composer:v2

      - name: 3. Сборка структуры релиза
        run: |
          mkdir release_build

          # Код библиотеки становится "локальным пакетом" внутри будущего vendor
          mkdir -p release_build/vendor/digitalstars/simplevk
          rsync -a . release_build/vendor/digitalstars/simplevk/ \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "release_build" \
            --exclude "tests" \
            --exclude "docs" \
            --exclude ".idea" \
            --exclude ".phpunit.cache"

          # Включаем в пакет release-bootstrap: вызов PackagistReporter
          # (анонимная статистика установок из архивов без Composer)
          cat > release_build/vendor/digitalstars/simplevk/release_bootstrap.php <<'PHP'
          <?php

          declare(strict_types=1);

          // Активация репортера ТОЛЬКО для CI-сборки релизного архива.
          \DigitalStars\SimpleVK\V4\Service\PackagistReporter::checkAndReport('${{ github.event.release.tag_name }}');
          PHP

          # Регистрируем bootstrap как autoload.files внутреннего пакета
          cd release_build/vendor/digitalstars/simplevk
          composer config --json autoload.files '["release_bootstrap.php"]'

          # Корневой composer.json сборки: ставим наш локальный пакет
          cd ../../../../release_build
          echo '{"name": "digitalstars/simplevk-release","description": "Release package for SimpleVK v4","repositories": [{"type": "path","url": "vendor/digitalstars/simplevk"}],"require": {"digitalstars/simplevk": "*"}}' > composer.json

      - name: 4. Установка зависимостей
        run: |
          cd release_build
          composer install --no-dev --optimize-autoloader --no-interaction
          rm -f composer.json composer.lock

      - name: 5. Подготовка имени архива
        id: prep
        run: echo "ARCHIVE_NAME=SimpleVK-${{ github.event.release.tag_name }}.zip" >> $GITHUB_ENV

      - name: 6. Создание ZIP-архива
        run: |
          cd release_build
          zip -rq ../${{ env.ARCHIVE_NAME }} .

      - name: 7. Загрузка архива в релиз
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./${{ env.ARCHIVE_NAME }}
          asset_name: ${{ env.ARCHIVE_NAME }}
          asset_content_type: application/zip
