#:schema https://mago.carthage.software/1.47.3/schema.json
# Конфигурация Mago для библиотеки SimpleVK.
# Адаптирован из E:\PhpstormProjects\tower_bot\mago.toml (см. docs-заметки tower_bot).
version = "1"
# Минимальная версия PHP, поддерживаемая библиотекой (см. composer.json)
php-version = "8.2.0"

[source]
paths    = ["src"]
includes = ["vendor"]
excludes = [
    "vendor/composer/**",
]

[source.glob]
literal-separator = true

[formatter]
preset = "default"

[linter]
minimum-fail-level = "warning"

[linter.rules]
# Осознанно выключено: declare(strict_types=1) не используется в библиотеке,
# т.к. строгий режим вместе с новыми нативными типами даст пользователям
# новые TypeError на строковых данных из VK API (ломает обратную совместимость)
strict-types = { enabled = false }
no-eval = { enabled = true, level = "error" }
no-global = { enabled = true, level = "error" }
no-error-control-operator = { enabled = true, level = "warning" }
no-multi-assignments = { enabled = true, level = "warning" }

# Вкусовщина / не применимо к legacy-коду библиотеки
no-boolean-flag-parameter = { enabled = false }
prefer-early-continue = { enabled = false }
no-else-clause = { enabled = false }
prefer-early-return = { enabled = false }
too-many-methods = { enabled = false }
cyclomatic-complexity = { enabled = false }
excessive-parameter-list = { enabled = false }
too-many-properties = { enabled = false }
ambiguous-function-call = { enabled = false }
literal-named-argument = { enabled = false }
halstead = { effort-threshold = 12000, volume-threshold = 2000 }
too-many-enum-cases = { enabled = false } # UpdateType — полный домен событий VK API
kan-defect = { enabled = false } # Эвристика Kan даёт FP на builder-классах с цепочками методов

[analyzer]
ignore = [
    # --- Данные VK API приходят нетипизированными (домен библиотеки) ---
    "mixed-method-access",
    "mixed-property-access",
    "mixed-argument",
    "mixed-assignment",
    "mixed-array-assignment",
    "mixed-operand",
    "mixed-array-access",
    "mixed-return-statement",
    "invalid-type-cast",
    "imprecise-type",
    "possibly-false-argument",
    "possibly-false-operand",
    "possibly-null-argument",
    "possibly-null-array-index",
    "incompatible-parameter-type",
    "mixed-property-type-coercion",
    "property-type-coercion",
    "invalid-iterator",            # foreach по массивам, полученным из VK API
    "null-operand",                # конкатенация с данными из VK
    "less-specific-argument",
    "less-specific-nested-argument-type",
    "less-specific-nested-return-statement",
    "less-specific-return-statement",
    "invalid-callable",
    "possibly-null-property-access",

    # --- Обратная совместимость: $vk остаётся nullable (Message можно создать без vk) ---
    "possible-method-access-on-null",

    # --- Ложные срабатывания анализатора ---
    "non-existent-method",         # FFI C-методы и методы, приходящие из трейтов
    "non-existent-property",       # свойства трейта Request ($auth/$token)
    "non-existent-function",       # litespeed_finish_request (ext отсутствует локально)
    "reference-constraint-violation", # by-ref параметры &$cfg — часть публичного API
    "undefined-variable",          # init*-API создаёт переменные через ссылки
    "unevaluated-code",
    "non-existent-class-constant",
    "no-value",
    "invalid-operand",
]

find-unused-definitions = false
find-unused-expressions = false
find-unused-parameters = false
analyze-dead-code = false

strict-list-index-checks = false
strict-array-index-existence = false
allow-array-truthy-operand = false
no-boolean-literal-comparison = false

unchecked-exceptions = ["Error", "LogicException"]
unchecked-exception-classes = []
check-throws = false
check-missing-override = false

check-missing-type-hints = true
check-property-initialization = false
memoize-properties = true
register-super-globals = true
